app-id: com.bitwarden.desktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: bitwarden.sh
finish-args:
  - --share=ipc
  - --share=network
  # This should be fallback-x11, but on gnome/mutter, zwlr_data_control_manager_v1 is not implemented
  # so we need to use x11 as a fallback to make copy paste work
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=com.canonical.AppMenu.Registrar
  - --system-talk-name=org.freedesktop.PolicyKit1
    # Lock on lockscreen
  - --talk-name=org.gnome.ScreenSaver
  - --talk-name=org.freedesktop.ScreenSaver
  - --system-talk-name=org.freedesktop.login1
  - --filesystem=xdg-download
  # Fido2 USB security keys
  - --device=all

  # Browser integration
  # The config directory is needed to write manifests for non-flatpak
  # Sockets are mounted in each app's directory
  #
  # Non-sandboxed
  - --filesystem=xdg-config/google-chrome/NativeMessagingHosts/
  - --filesystem=xdg-config/chromium/NativeMessagingHosts/
  - --filesystem=xdg-config/microsoft-edge/NativeMessagingHosts/
  - --filesystem=home/.mozilla
  # Flatpak-sandboxed
  - --filesystem=~/.var/app/org.chromium.Chromium/config/chromium/NativeMessagingHosts/
  - --filesystem=~/.var/app/com.google.Chrome/config/google-chrome/NativeMessagingHosts/
  - --filesystem=~/.var/app/com.microsoft.Edge/config/microsoft-edge/NativeMessagingHosts/
  # Firefox does not create NMHS directory by default
  - --filesystem=~/.var/app/org.mozilla.firefox/.mozilla/
rename-desktop-file: bitwarden.desktop
rename-icon: bitwarden
modules:
  - name: bitwarden-desktop
    buildsystem: simple
    build-commands:
      - mkdir -p "$FLATPAK_DEST/Bitwarden"
      - tar -xzf bitwarden.tar.gz -C "${FLATPAK_DEST}/Bitwarden"
      - install -D bitwarden.sh "${FLATPAK_DEST}/bin/bitwarden.sh"
      - install -D -m 644 "${FLATPAK_ID}.metainfo.xml" -t "${FLATPAK_DEST}/share/metainfo"
      - install -D -m 644 "${FLATPAK_DEST}/Bitwarden/resources/com.bitwarden.desktop.desktop"
        "${FLATPAK_DEST}/share/applications/bitwarden.desktop"
      - desktop-file-edit --set-key=Exec --set-value="bitwarden.sh %U" "${FLATPAK_DEST}/share/applications/bitwarden.desktop"
      - |
        for icon in "${FLATPAK_DEST}"/Bitwarden/resources/icons/*.png; do
          size="$(basename -s .png ${icon})"
          if [ "${size}" == '1024x1024' ]; then continue; fi
          install -D -m 644 "${icon}" "${FLATPAK_DEST}/share/icons/hicolor/${size}/apps/bitwarden.png"
        done

      # To allow separate locales
      # https://searchfox.org/mozilla-central/rev/8a4f55bc09ffc5c25dcb4586c51ae4a9fee77b4c/taskcluster/docker/firefox-flatpak/runme.sh#131-133
      - |
        for lang in "${FLATPAK_DEST}"/Bitwarden/locales/*.pak; do
          locale="$(basename -s .pak ${lang})"
          install -D -m 644 "${lang}" -t "${FLATPAK_DEST}/share/runtime/locale/${locale%%-*}/"
          ln -sf "${FLATPAK_DEST}/share/runtime/locale/${locale%%-*}/$(basename ${lang})" "${FLATPAK_DEST}/Bitwarden/locales/$(basename ${lang})"
        done
    sources:
      - type: file
        dest-filename: bitwarden.tar.gz
        only-arches:
          - x86_64
        url: https://github.com/bitwarden/clients/releases/download/desktop-v2026.8.0/bitwarden_2026.8.0_x64.tar.gz
        sha256: d88fd894e4b1c58bde3efb51b7b1bd8fab6c6a46be632b0b9cdadcc00147790e
        x-checker-data:
          type: anitya
          project-id: 179174
          url-template: https://github.com/bitwarden/clients/releases/download/desktop-v$version/bitwarden_${version}_x64.tar.gz
          is-main-source: true
      - type: file
        dest-filename: bitwarden.tar.gz
        only-arches:
          - aarch64
        url: https://github.com/bitwarden/clients/releases/download/desktop-v2026.8.0/bitwarden_2026.8.0_arm64.tar.gz
        sha256: 5962b5dd1bfe19b3c198a6b4157c4431efe078e573217bffcaafa71147476ebe
        x-checker-data:
          type: anitya
          project-id: 179174
          url-template: https://github.com/bitwarden/clients/releases/download/desktop-v$version/bitwarden_${version}_arm64.tar.gz
      - type: file
        path: bitwarden.sh
      - type: file
        path: com.bitwarden.desktop.metainfo.xml

  - name: bitwarden-cli
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - unzip bw-oss-linux*.zip
      - install -D -m 755 -t "${FLATPAK_DEST}/bin" bw
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/bitwarden/clients/releases/download/cli-v2026.8.0/bw-oss-linux-2026.8.0.zip
        sha256: d8bbc213d3dbdb701709386af6ea3bd763482f922ae0b538fdc3fdb88b1b1704
        x-checker-data:
          type: anitya
          project-id: 229011
          url-template: https://github.com/bitwarden/clients/releases/download/cli-v$version/bw-oss-linux-$version.zip
